<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>FitLife | Sign In</title>

    <!-- Favicon — Dumbbell -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 640'><rect width='640' height='640' rx='140' fill='%23ff5c00'/><path fill='white' d='M112 288c0-17.7 14.3-32 32-32h16v-64c0-17.7 14.3-32 32-32h16c17.7 0 32 14.3 32 32v64h160v-64c0-17.7 14.3-32 32-32h16c17.7 0 32 14.3 32 32v64h16c17.7 0 32 14.3 32 32v64c0 17.7-14.3 32-32 32h-16v64c0 17.7-14.3 32-32 32h-16c-17.7 0-32-14.3-32-32v-64H240v64c0 17.7-14.3 32-32 32h-16c-17.7 0-32-14.3-32-32v-64h-16c-17.7 0-32-14.3-32-32v-64z'/></svg>">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background:
                linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.75) 100%),
                url('https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=1600&q=80')
                center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #111;
        }

        a { text-decoration: none; color: inherit; }

        .auth-card {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-radius: 8px;
            padding: 45px 40px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.4);
        }

        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #111;
        }
        .auth-brand-icon {
            width: 48px; height: 48px;
            background: #ff5c00;
            color: #fff;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 6px 18px rgba(255,92,0,0.35);
        }
        .auth-brand .orange { color: #ff5c00; }

        .auth-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #111;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
            background: #fafafa;
        }
        .form-group input:focus {
            border-color: #ff5c00;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255,92,0,0.1);
        }

        .pw-wrap { position: relative; }
        .pw-toggle {
            position: absolute;
            top: 50%; right: 14px;
            transform: translateY(-50%);
            background: transparent; border: none;
            color: #999; font-size: 16px;
            cursor: pointer; padding: 6px;
        }
        .pw-toggle:hover { color: #ff5c00; }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .form-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #666;
        }
        .form-row input[type="checkbox"] {
            accent-color: #ff5c00;
        }
        .form-row a {
            color: #ff5c00;
            font-weight: 700;
            font-size: 12px;
        }
        .form-row a:hover { text-decoration: underline; }

        .auth-btn {
            width: 100%;
            background: #ff5c00;
            color: #fff;
            border: 2px solid #ff5c00;
            padding: 16px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .auth-btn:hover {
            background: transparent;
            color: #ff5c00;
        }
        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-switch {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #666;
        }
        .auth-switch a {
            color: #ff5c00;
            font-weight: 700;
        }
        .auth-switch a:hover { text-decoration: underline; }

        .alert {
            padding: 14px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }
        .alert.show { display: block; }
        .alert.success {
            background: #dcfce7;
            color: #16a34a;
            border-left: 4px solid #22c55e;
        }
        .alert.error {
            background: #fee2e2;
            color: #dc2626;
            border-left: 4px solid #ef4444;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
            transition: 0.3s;
        }
        .back-home:hover { color: #ff5c00; }

        @media (max-width: 575px) {
            .auth-card { padding: 35px 25px; }
            .auth-title { font-size: 22px; }
        }

    </style>

</head>

<body>

<div class="auth-card">

    <a href="index.html" class="auth-brand">
        <span class="auth-brand-icon"><i class="fa-solid fa-dumbbell"></i></span>
        <span>FIT<span class="orange">LIFE</span></span>
    </a>

    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to continue your fitness journey.</p>

    <div id="alertBox" class="alert"></div>

    <form id="signinForm" autocomplete="off">

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="pw-wrap">
                <input type="password" name="password" id="pw1" placeholder="Enter password" required>
                <button type="button" class="pw-toggle" data-target="pw1"><i class="bi bi-eye"></i></button>
            </div>
        </div>

        <div class="form-row">
            <label>
                <input type="checkbox" name="remember">
                Remember me
            </label>
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="auth-btn" id="signinBtn">
            Sign In
        </button>

    </form>

    <p class="auth-switch">
        Don't have an account? <a href="signup.html">Sign Up</a>
    </p>

    <a href="index.html" class="back-home">← Back to Home</a>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const form     = document.getElementById("signinForm");
    const btn      = document.getElementById("signinBtn");
    const alertBox = document.getElementById("alertBox");

    function showAlert(msg, type = "error") {
        alertBox.textContent = msg;
        alertBox.className = "alert " + type + " show";
    }

    // Password toggles
    document.querySelectorAll(".pw-toggle").forEach((b) => {
        b.addEventListener("click", () => {
            const input = document.getElementById(b.dataset.target);
            input.type = input.type === "password" ? "text" : "password";
            b.querySelector("i").className =
                input.type === "password" ? "bi bi-eye" : "bi bi-eye-slash";
        });
    });

    // Submit
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Signing in...";
        alertBox.className = "alert";

        const fd = new FormData(form);

        try {
            const res = await fetch("api/login.php", {
                method: "POST",
                body: fd,
                credentials: "same-origin"
            });
            const data = await res.json();

            if (data.success) {
                showAlert("✅ Welcome back, " + data.data.name + "!", "success");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1200);
            } else {
                showAlert(data.message || "Login failed", "error");
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        } catch (err) {
            showAlert("Network error: " + err.message, "error");
            btn.disabled = false;
            btn.textContent = "Sign In";
        }
    });

});
</script>

</body>
</html>
